
name: FIRST BLOOD - iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_TAG: 4.4.1-stable
  GODOT_TEMPLATE_DIR: 4.4.1.stable

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FIRST BLOOD with parkour
        shell: bash
        run: |
          set -euo pipefail

          unzip -oq FIRST_BLOOD_PARKOUR_v02.zip -d .

          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg

          python3 - <<'PY'
          from pathlib import Path

          p = Path("project.godot")
          s = p.read_text(encoding="utf-8")
          key = "textures/vram_compression/import_etc2_astc=true"

          if key not in s:
              assert "[rendering]" in s
              s = s.replace(
                  "[rendering]",
                  "[rendering]\n" + key,
                  1
              )
              p.write_text(s, encoding="utf-8")

          print("iOS ETC2/ASTC enabled")
          PY

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot"

          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_APP="$(find "$RUNNER_TEMP/godot" \
            -name Godot.app -type d -print -quit)"

          test -n "$GODOT_APP"

          echo "GODOT_BIN=$GODOT_APP/Contents/MacOS/Godot" \
            >> "$GITHUB_ENV"

      - name: Install iOS export templates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/tmpl"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            'templates/ios.zip' \
            -d "$RUNNER_TEMP/tmpl"

          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"

          mkdir -p "$DEST"

          cp "$RUNNER_TEMP/tmpl/templates/ios.zip" \
            "$DEST/ios.zip"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" --headless --path . \
            --editor --import --quit

      - name: Export Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ios

          "$GODOT_BIN" --headless --verbose --path . \
            --export-release "iOS" \
            "build/ios/FirstBlood.xcodeproj"

          test -d build/ios/FirstBlood.xcodeproj

          xcodebuild -list \
            -project build/ios/FirstBlood.xcodeproj

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project build/ios/FirstBlood.xcodeproj \
            -scheme FirstBlood \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FirstBlood.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          APP="$(find "$RUNNER_TEMP/FirstBlood.xcarchive/Products/Applications" \
            -maxdepth 1 -name '*.app' -type d \
            -print -quit)"

          test -n "$APP"

          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -qr "$GITHUB_WORKSPACE/FirstBlood-unsigned.ipa" \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FIRST-BLOOD-UNSIGNED-IPA
          path: FirstBlood-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
